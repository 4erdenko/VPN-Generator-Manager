[metadata]
name = vpn-bot-manager
version = 1.0.0
description = Telegram bot for managing VPN servers from VPNgen
author = Your Name
license = MIT

[flake8]
# Ignore specific style warnings
ignore =
    W503,  # line break before binary operator
    F811,  # redefined unused name
    E203   # whitespace before ':'
max-line-length = 88
# Exclude directories from checking
exclude =
    venv/,
    */venv/,
    env/,
    */env/,
    .venv/,
    */.venv/,
    .github/,
    */.github/,
    coredns/,
    */coredns/,
    wireguard/,
    */wireguard/,
    templates/,
    */templates/,
    __pycache__/,
    */__pycache__/,

[isort]
known_first_party = vpnworks, telegram, wireguard
